syntax = "proto3";

package trading.v1;

option go_package = "github.com/fundbest/fundbest-protobuf/gen/go/trading/v1;tradingv1";

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_PASSED = 2;
  STATUS_FAILED = 3;
  STATUS_RISK_STOP = 4;
}

enum Reason {
  REASON_UNSPECIFIED = 0;
  REASON_DAILY_LOSS = 1;
  REASON_MAX_LOSS = 2;
  REASON_TARGET = 3;
  REASON_MANUAL = 4;
  REASON_SL = 5;
  REASON_TP = 6;
  REASON_STOP_OUT = 7;
}

message Position {
  uint64 id = 1;
  uint32 symbol_id = 2;
  bool buy = 3;
  int64 lots = 4;
  int64 open = 5;
  int64 sl = 6;
  int64 tp = 7;
  int64 open_ms = 8;
  int32 risk_bps = 9;
}

message Closed {
  uint64 id = 1;
  int64 close = 2;
  int64 profit = 3;
  int64 close_ms = 4;
  Reason reason = 5;
}

message Account {
  uint64 id = 1;
  Status status = 2;
  Reason reason = 3;
  int64 balance = 4;
  int64 equity = 5;
  int64 margin = 6;
  int32 risk_bps = 7;
  int32 daily_dd_bps = 8;
  int32 daily_limit_bps = 9;
  int32 total_dd_bps = 10;
  int32 total_limit_bps = 11;
  int32 profit_bps = 12;
  int32 target_bps = 13;
}

message Event {
  uint64 seq = 1;
  int64 ts_ms = 2;
  Account account = 3;
  repeated Position upsert = 4;
  repeated Closed closed = 5;
  bool snapshot = 6;
}